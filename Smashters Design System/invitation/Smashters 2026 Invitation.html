<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Smashters 2026 — You're Invited</title>

  <!-- PWA / home-screen launch (hides browser chrome when added to home screen) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Smashters 2026">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- iMessage / social preview -->
  <meta property="og:title" content="Smashters 2026 — You're Invited">
  <meta property="og:description" content="The Dumpster Fire Golf Club cordially invites you to the 2026 Smashters Tournament at El Macero Country Club, May 14–16.">
  <meta property="og:image" content="https://smashters.com/Smashters%20Design%20System/invitation/assets/DFGC%20Logo.png">
  <meta property="og:url" content="https://smashters.com/Smashters%20Design%20System/invitation/Smashters%202026%20Invitation.html">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Smashters 2026 — You're Invited">
  <meta name="twitter:image" content="https://smashters.com/Smashters%20Design%20System/invitation/assets/DFGC%20Logo.png">

  <style>
    @font-face {
      font-family: 'Azalea';
      src: url('fonts/Azalea.otf') format('opentype'),
           url('fonts/Azalea.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      /* env(safe-area-inset-*) fills the notch/home-indicator area */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      /* Same radial gradient as BgWallpaper so letterbox bars blend seamlessly */
      background: radial-gradient(ellipse at center, #0a5638 0%, #00432e 45%, #001a10 100%);
      font-family: 'Trebuchet MS', 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }
    body { display: flex; align-items: center; justify-content: center; }
    #root { width: 100%; height: 100%; }
  </style>

  <script>
    // Request fullscreen on first tap — hides the browser address bar on Android.
    // iOS Safari doesn't support requestFullscreen from a browser tab (only from home screen),
    // but this is a no-op on iOS so it's safe to call.
    (function () {
      var done = false;
      function goFull() {
        if (done) return;
        done = true;
        var el = document.documentElement;
        var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
        if (fn) fn.call(el).catch(function(){});
        document.removeEventListener('touchstart', goFull);
        document.removeEventListener('click', goFull);
      }
      document.addEventListener('touchstart', goFull, { once: true, passive: true });
      document.addEventListener('click',      goFull, { once: true });
    })();
  </script>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="animations.jsx"></script>
  <script type="text/babel" src="scene.jsx"></script>

  <script type="text/babel">
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <Stage width={450} height={900} duration={17} background="#050505" autoplay loop={false} controls={false}>
        <InvitationScene />
      </Stage>
    );
  </script>
</body>
</html>
