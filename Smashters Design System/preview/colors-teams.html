<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
.wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.team { border-radius: 12px; padding: 18px; color: #fff; min-height: 140px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.team .name { font-weight: bold; text-transform: uppercase; letter-spacing: 1px; font-size: 13px; }
.team .pts { font-size: 2.8rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.team .meta { font-family: ui-monospace, Menlo, monospace; font-size: 11px; opacity: 0.9; }
.a { background: #CE1141; }
.b { background: #004F9E; }
</style></head><body>
<div class="wrap">
  <div class="team a"><span class="name">Team A · Red</span><div class="pts">14½</div><div class="meta">#CE1141 · --team-a-color</div></div>
  <div class="team b"><span class="name">Team B · Blue</span><div class="pts">13½</div><div class="meta">#004F9E · --team-b-color</div></div>
</div>
</body></html>
