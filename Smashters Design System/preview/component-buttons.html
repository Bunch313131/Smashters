<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
body { padding: 18px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
button { font-family: 'Trebuchet MS', sans-serif; font-weight: bold; letter-spacing: 0.8px; text-transform: uppercase; font-size: 13px; padding: 12px 22px; border-radius: 8px; cursor: pointer; border: none; transition: all 0.2s ease; }
.primary { background: #006747; color: #fff; }
.primary:hover { background: #00432e; }
.secondary { background: #FBF308; color: #00432e; }
.outline { background: transparent; color: #006747; border: 2px solid #006747; padding: 10px 20px; }
.outline:hover { background: #006747; color: #fff; }
.danger { background: #CE1141; color: #fff; }
.ghost { background: transparent; color: #666; border: 2px solid #ddd; padding: 10px 20px; }
.sml { padding: 8px 14px; font-size: 11px; }
.meta { font-family: ui-monospace, Menlo, monospace; font-size: 9px; color: #999; letter-spacing: 0.3px; margin-top: 10px; }
</style></head><body>
<div class="row">
  <button class="primary">Host Live Game</button>
  <button class="secondary">I Accept</button>
  <button class="outline">Join Match</button>
  <button class="danger">Clear Scores</button>
  <button class="ghost sml">Cancel</button>
</div>
<div class="meta">Primary · Secondary (broadcast gold) · Outline · Danger · Ghost · hover darken 1 step · :active scale(0.97) + vibrate(10)</div>
</body></html>
