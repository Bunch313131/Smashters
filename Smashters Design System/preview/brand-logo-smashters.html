<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
body { padding: 0; margin: 0; background: #fff; }
.stage { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: center; }
.cell { border-radius: 12px; padding: 20px; display: flex; align-items: center; justify-content: center; min-height: 170px; }
.cell img { max-width: 100%; max-height: 140px; object-fit: contain; }
.light { background: #fff; border: 1px solid #eee; }
.dark { background: linear-gradient(160deg, #00432e 0%, #006747 40%, #00432e 100%); }
.caption { grid-column: span 2; font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: #888; letter-spacing: 0.3px; text-align: center; }
</style></head><body>
<div class="stage">
  <div class="cell light"><img src="../assets/images/smashters-logo-green.png" alt="Smashters primary"></div>
  <div class="cell dark"><img src="../assets/images/smashters-logo-green.png" alt="Smashters on dark" style="filter: brightness(1.5) contrast(1.1)"></div>
  <div class="caption">SMASHTERS word + map mark · green on white (primary) · on Masters gradient (broadcast / splash)</div>
</div>
</body></html>
