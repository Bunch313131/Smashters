<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
body { padding: 0; margin: 0; background: #fff; }
.stage { padding: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.panel { border-radius: 12px; min-height: 170px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
.grad { background: linear-gradient(160deg, #00432e 0%, #006747 40%, #00432e 100%); color: #FBF308; }
.wall { background: linear-gradient(160deg, #00432e 0%, #006747 40%, #00432e 100%); position: relative; overflow: hidden; }
.wall .wm { position: absolute; inset: -20%; background-image: url('../assets/images/Phone Size DFCG No Background.png'); background-size: 120px; opacity: 0.08; transform: rotate(-15deg); }
.wall .t { position: relative; color: #FBF308; }
.lbl { font-family: 'Trebuchet MS', sans-serif; font-weight: bold; text-transform: uppercase; letter-spacing: 1.5px; font-size: 12px; }
.meta { font-family: ui-monospace, Menlo, monospace; font-size: 9px; opacity: 0.75; color: rgba(255,255,255,0.8); }
.grad .meta { color: rgba(255,255,255,0.8); }
</style></head><body>
<div class="stage">
  <div class="panel grad"><span class="lbl">Masters Gradient</span><span class="meta">linear-gradient(160deg, #00432e 0%, #006747 40%, #00432e 100%)</span></div>
  <div class="panel wall"><div class="wm"></div><div class="t" style="display:flex; flex-direction:column; justify-content:space-between; height:100%"><span class="lbl">Crest Wallpaper</span><span class="meta">DFGC stamps · -15° · 4–8% opacity · TV / broadcast mode</span></div></div>
</div>
</body></html>
