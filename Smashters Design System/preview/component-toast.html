<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
body { padding: 18px; background: #f4f1ec; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.toast { font-family: 'Trebuchet MS', sans-serif; font-weight: bold; font-size: 13px; letter-spacing: 0.3px; padding: 12px 18px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); color: #fff; }
.ok { background: #006747; }
.warn { background: #C8A951; color: #00432e; }
.err { background: #CE1141; }
.info { background: #004F9E; }
.meta { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: #999; margin-top: 6px; }
</style></head><body>
<div class="toast ok">Hosting · A4K92Z</div>
<div class="toast info">Draft is live</div>
<div class="toast warn">Waiting for matchups to begin</div>
<div class="toast err">Incorrect password</div>
<div class="meta">Toasts — single-line · bold · tracked · corner of screen</div>
</body></html>
