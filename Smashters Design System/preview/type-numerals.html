<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
body { padding: 20px; display: flex; gap: 20px; align-items: center; }
.card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 16px 22px; display: flex; flex-direction: column; align-items: center; min-width: 120px; }
.card .label { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: #666; font-weight: bold; }
.card .val { font-family: 'Trebuchet MS', sans-serif; font-weight: 800; font-variant-numeric: tabular-nums; color: #006747; line-height: 1; margin-top: 6px; }
.val.big { font-size: 48px; }
.val.mid { font-size: 32px; }
.val.tiny { font-size: 22px; }
.meta { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: #999; }
</style></head><body>
<div class="card"><span class="label">Team A</span><span class="val big">14½</span></div>
<div class="card"><span class="label">Thru</span><span class="val mid">14</span></div>
<div class="card"><span class="label">Score</span><span class="val mid" style="color:#CE1141">1 UP</span></div>
<div class="card"><span class="label">Final</span><span class="val tiny" style="color:#1a1a1a">3 &amp; 1</span></div>
<div style="flex:1"></div>
<div class="meta" style="align-self:flex-end">.score-numeral · tabular-nums · 800</div>
</body></html>
