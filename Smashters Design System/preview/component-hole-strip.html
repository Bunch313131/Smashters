<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
body { padding: 16px; background: #fff; }
.strip { display: flex; gap: 6px; padding: 10px; background: #f6f4ee; border-radius: 10px; overflow-x: auto; }
.dot { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Trebuchet MS', sans-serif; font-weight: bold; font-size: 13px; background: #fff; color: #1a1a1a; border: 2px solid transparent; transition: all 0.15s ease; font-variant-numeric: tabular-nums; }
.dot.played { background: #006747; color: #fff; }
.dot.birdie { border-color: #CE1141; }
.dot.eagle { border-color: #C8A951; border-style: double; border-width: 3px; }
.dot.current { background: #FBF308; color: #00432e; box-shadow: 0 0 0 3px rgba(251,243,8,0.35); }
.meta { font-family: ui-monospace, Menlo, monospace; font-size: 9px; color: #999; margin-top: 10px; letter-spacing: 0.3px; }
</style></head><body>
<div class="strip">
  <div class="dot played">1</div>
  <div class="dot played birdie">2</div>
  <div class="dot played">3</div>
  <div class="dot played eagle">4</div>
  <div class="dot played">5</div>
  <div class="dot played birdie">6</div>
  <div class="dot played">7</div>
  <div class="dot current">8</div>
  <div class="dot">9</div>
  <div class="dot">10</div>
  <div class="dot">11</div>
  <div class="dot">12</div>
  <div class="dot">13</div>
  <div class="dot">14</div>
  <div class="dot">15</div>
  <div class="dot">16</div>
  <div class="dot">17</div>
  <div class="dot">18</div>
</div>
<div class="meta">Hole strip — green played · red birdie ring · gold double-ring eagle · yellow current</div>
</body></html>
