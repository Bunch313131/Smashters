<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
body { padding: 24px; background: #f4f1ec; display: flex; gap: 20px; }
.card { background: #fff; border-radius: 12px; padding: 20px 14px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; min-height: 130px; }
.s1 { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.s2 { box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
.s3 { box-shadow: 0 4px 20px rgba(0,0,0,0.25); }
.s4 { box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
.lbl { font-family: 'Trebuchet MS', sans-serif; font-weight: bold; text-transform: uppercase; letter-spacing: 0.6px; font-size: 11px; color: #006747; }
.meta { font-family: ui-monospace, Menlo, monospace; font-size: 9px; color: #888; }
</style></head><body>
<div class="card s1"><div class="lbl">Resting</div><div class="meta">--card-shadow</div></div>
<div class="card s2"><div class="lbl">Hover</div><div class="meta">--card-shadow-hover</div></div>
<div class="card s3"><div class="lbl">On Dark</div><div class="meta">--card-shadow-big</div></div>
<div class="card s4"><div class="lbl">Modal</div><div class="meta">--modal-shadow</div></div>
</body></html>
