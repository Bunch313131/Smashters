<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
.row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.sw { border-radius: 8px; min-height: 100px; padding: 12px; color: #fff; display: flex; flex-direction: column; justify-content: space-between; }
.lbl { font-weight: bold; text-transform: uppercase; letter-spacing: 0.6px; font-size: 11px; }
.hex { font-family: ui-monospace, Menlo, monospace; font-size: 10px; opacity: 0.9; }
.vname { font-family: ui-monospace, Menlo, monospace; font-size: 9px; opacity: 0.75; margin-top: 2px; }
.example { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
</style></head><body>
<div class="row">
  <div class="sw" style="background:#CE1141"><span class="lbl">Birdie</span><span class="example">−1</span><div><div class="hex">#CE1141</div><div class="vname">--birdie-color</div></div></div>
  <div class="sw" style="background:#C8A951;color:#1a1a1a"><span class="lbl">Eagle</span><span class="example">−2</span><div><div class="hex">#C8A951</div><div class="vname">--eagle-color</div></div></div>
  <div class="sw" style="background:#006747"><span class="lbl">Bogey</span><span class="example">+1</span><div><div class="hex">#006747</div><div class="vname">--bogey-color</div></div></div>
</div>
</body></html>
