<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
body { padding: 18px; background: #fff; }
.field { margin-bottom: 12px; }
.field label { display: block; font-family: 'Trebuchet MS', sans-serif; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; color: #666; margin-bottom: 6px; }
.field input { width: 100%; font-family: 'Trebuchet MS', sans-serif; font-size: 15px; padding: 10px 12px; border: 2px solid #ddd; border-radius: 8px; background: #fff; transition: border-color 0.2s ease; }
.field input:focus { outline: none; border-color: #006747; }
.field input.code { letter-spacing: 4px; font-weight: bold; font-variant-numeric: tabular-nums; text-align: center; color: #006747; text-transform: uppercase; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
</style></head><body>
<div class="row">
  <div class="field"><label>Player Name</label><input value="Phil Mickelson" /></div>
  <div class="field"><label>Handicap</label><input value="12.4" /></div>
</div>
<div class="field"><label>Room Code</label><input class="code" value="A4K92Z" /></div>
</body></html>
