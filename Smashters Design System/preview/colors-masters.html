<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
.row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.sw { border-radius: 8px; min-height: 110px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; }
.lbl { font-weight: bold; text-transform: uppercase; letter-spacing: 0.6px; font-size: 11px; }
.hex { font-family: ui-monospace, Menlo, monospace; font-size: 10px; opacity: 0.9; }
.vname { font-family: ui-monospace, Menlo, monospace; font-size: 9px; opacity: 0.75; margin-top: 2px; }
</style></head><body>
<div class="row">
  <div class="sw" style="background:#00432e;color:#fff"><span class="lbl">Masters Dark</span><div><div class="hex">#00432E</div><div class="vname">--masters-dark</div></div></div>
  <div class="sw" style="background:#006747;color:#fff"><span class="lbl">Masters Green</span><div><div class="hex">#006747</div><div class="vname">--masters-green</div></div></div>
  <div class="sw" style="background:#1a8a5c;color:#fff"><span class="lbl">Light Green</span><div><div class="hex">#1A8A5C</div><div class="vname">--masters-light-green</div></div></div>
  <div class="sw" style="background:#002a1c;color:#fff"><span class="lbl">Darkest</span><div><div class="hex">#002A1C</div><div class="vname">--masters-darkest</div></div></div>
  <div class="sw" style="background:#FBF308;color:#00432e"><span class="lbl">Broadcast Gold</span><div><div class="hex">#FBF308</div><div class="vname">--masters-yellow</div></div></div>
  <div class="sw" style="background:#C8A951;color:#1a1a1a"><span class="lbl">Eagle Gold</span><div><div class="hex">#C8A951</div><div class="vname">--eagle-color</div></div></div>
  <div class="sw" style="background:#fff;color:#1a1a1a;border:1px solid #ddd"><span class="lbl">Body White</span><div><div class="hex">#FFFFFF</div><div class="vname">--bg</div></div></div>
  <div class="sw" style="background:#1a1a1a;color:#fff"><span class="lbl">Black</span><div><div class="hex">#1A1A1A</div><div class="vname">--masters-black</div></div></div>
</div>
</body></html>
